server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}